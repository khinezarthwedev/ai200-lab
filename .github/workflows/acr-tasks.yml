# Create ACR Tasks that build INSIDE the registry (no external build server):
#  - source-triggered task: a commit to main -> build + push (ACR creates the Git webhook for you)  (Q13, Q84)
#  - base image update trigger: python:3.12-slim on Docker Hub is patched -> rebuild             (Proseware)
# Needs a GitHub fine-grained token with "Contents: read" and "Webhooks: read and write" on this repo,
# saved as the repository secret ACR_TASK_GIT_PAT. Run deploy.yml first (it creates the registry).
name: acr-tasks

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  create-tasks:
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create source-triggered + base-image-triggered task
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          GIT_PAT: ${{ secrets.ACR_TASK_GIT_PAT }}
        run: |
          ACR=$(az deployment group show -g "$RG" -n main --query properties.outputs.ACR_NAME.value -o tsv)
          az acr task create \
            --registry "$ACR" \
            --name build-search-api \
            --image 'search-api:{{.Run.ID}}' --image search-api:latest \
            --context "https://github.com/${{ github.repository }}.git#main:src/search-api" \
            --file Dockerfile \
            --git-access-token "$GIT_PAT" \
            --commit-trigger-enabled true \
            --base-image-trigger-enabled true \
            --base-image-trigger-type Runtime
          az acr task run --registry "$ACR" --name build-search-api
          az acr task list-runs --registry "$ACR" -o table
